<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>マイアセット</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png">
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="マイアセット">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="手入力した資産と家計をグラフで確認する、端末内保存の資産管理アプリ">
<style>
  :root {
    color-scheme: light;
    --page:#f9f9f7; --surface-1:#fcfcfb;
    --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#898781;
    --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10);
    --wash:rgba(11,11,11,.04); --wash-strong:rgba(11,11,11,.08);
    /* 配色は JS が上書きする（テーマ切り替え）。ここは初期表示用の既定値 */
    --p0:#9ab1e4; --p1:#6b93dc; --p2:#2976d3; --p3:#1e5ba5; --p4:#13427a;
    --s0:#88bab3; --s1:#41a296; --s2:#0b857a; --s3:#06675e; --s4:#034b44;
    --accent:#1e5ba5; --on-accent:#ffffff; --accent-soft:#2976d3; --card-line:#2976d3;
    --series-inc:#2976d3; --series-exp:#1e5ba5;
    --sel-wash:rgba(11,11,11,.045);
    --up:#006300; --down:#d03b3b; --focus:#2a78d6;
    --shadow:0 8px 28px rgba(11,11,11,.16);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page:#0d0d0d; --surface-1:#1a1a19;
      --text-primary:#fff; --text-secondary:#c3c2b7; --text-muted:#898781;
      --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
      --wash:rgba(255,255,255,.05); --wash-strong:rgba(255,255,255,.10);
      --p0:#1a5194; --p1:#246abd; --p2:#5286d9; --p3:#88a4e0; --p4:#b2c2e9;
      --s0:#055c54; --s1:#09776d; --s2:#0e978a; --s3:#70b0a7; --s4:#a7c9c4;
      --accent:#5286d9; --on-accent:#0b0b0b; --accent-soft:#5286d9; --card-line:#5286d9;
      --series-inc:#5286d9; --series-exp:#88a4e0;
      --sel-wash:rgba(255,255,255,.055);
      --up:#0ca30c; --down:#d03b3b; --focus:#3987e5;
      --shadow:0 8px 28px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:#0d0d0d; --surface-1:#1a1a19;
    --text-primary:#fff; --text-secondary:#c3c2b7; --text-muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
    --wash:rgba(255,255,255,.05); --wash-strong:rgba(255,255,255,.10);
    --p0:#1a5194; --p1:#246abd; --p2:#5286d9; --p3:#88a4e0; --p4:#b2c2e9;
    --s0:#055c54; --s1:#09776d; --s2:#0e978a; --s3:#70b0a7; --s4:#a7c9c4;
    --accent:#5286d9; --on-accent:#0b0b0b; --accent-soft:#5286d9; --card-line:#5286d9;
    --series-inc:#5286d9; --series-exp:#88a4e0;
    --sel-wash:rgba(255,255,255,.055);
    --up:#0ca30c; --down:#d03b3b; --focus:#3987e5;
    --shadow:0 8px 28px rgba(0,0,0,.5);
  }

  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; }
  body {
    background:var(--page); color:var(--text-primary);
    font-family:system-ui,-apple-system,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic UI",sans-serif;
    font-size:15px; line-height:1.6; -webkit-text-size-adjust:100%;
    -webkit-tap-highlight-color:transparent;
  }
  .wrap { max-width:1040px; margin:0 auto;
          padding:24px max(16px,env(safe-area-inset-left)) calc(72px + env(safe-area-inset-bottom)); }

  .banner { border:1px solid var(--border); border-left:3px solid var(--down); border-radius:8px;
            background:var(--surface-1); padding:10px 14px; font-size:13px; margin-bottom:16px; }
  /* 上段のセクション切り替え */
  .seg.sect { display:flex; width:100%; gap:8px; margin-bottom:14px; }
  .seg.sect button { flex:1 1 0; padding:9px 8px; font-size:14px; }

  .topbar { display:flex; align-items:center; gap:12px; margin-bottom:20px; }
  .brand { display:flex; align-items:center; gap:10px; min-width:0; }
  .brand-mark { width:26px; height:26px; border-radius:7px; flex:0 0 auto; display:block; }
  .brand h1 { font-size:19px; font-weight:650; margin:0; letter-spacing:.01em; white-space:nowrap; }
  .topbar .spacer { flex:1 1 auto; }
  .icon-btn { width:38px; height:38px; display:flex; flex-direction:column; align-items:center;
              justify-content:center; gap:4px; background:var(--surface-1);
              border:1px solid var(--border); border-radius:9px; cursor:pointer; }
  .icon-btn i { display:block; width:16px; height:1.5px; background:var(--text-primary); border-radius:1px; }
  .menu-wrap { position:relative; flex:0 0 auto; }
  .menu { position:absolute; right:0; top:calc(100% + 8px); z-index:30; min-width:232px;
          background:var(--surface-1); border:1px solid var(--border); border-radius:11px;
          box-shadow:var(--shadow); padding:6px; }
  .menu[hidden] { display:none; }
  .menu-h { font-size:11px; color:var(--text-muted); padding:6px 10px 5px; }
  .menu-sep { height:1px; background:var(--border); margin:6px 4px; }
  .menu-item { display:flex; align-items:center; gap:9px; width:100%; text-align:left;
               background:none; border:0; border-radius:8px; padding:8px 10px;
               font-size:14px; color:var(--text-primary); cursor:pointer; }
  .menu-item:hover { background:var(--wash); }
  .menu-item .ck { width:16px; font-size:16px; font-weight:700; visibility:hidden; flex:0 0 auto; }
  .menu-item[aria-checked="true"] { font-weight:600; }
  .menu-item[aria-checked="true"] .ck { visibility:visible; color:var(--accent); }
  .menu-item .chips { margin-left:auto; display:flex; gap:2px; flex:0 0 auto; }
  .menu-item .chips i { display:block; width:9px; height:16px; border-radius:2px; }
  .sel-tick { fill:var(--text-primary); font-weight:700; }

  button,select,input,textarea { font:inherit; color:inherit; }
  .btn { background:var(--surface-1); color:var(--text-primary); border:1px solid var(--border);
         border-radius:8px; padding:6px 12px; cursor:pointer; font-size:13px; touch-action:manipulation; }
  .btn:hover { background:var(--wash); }
  .btn.primary { background:var(--accent); border-color:transparent; color:var(--on-accent); font-weight:600; }
  .btn.danger { color:var(--down); }
  .btn.small { padding:3px 9px; font-size:12px; }
  :focus-visible { outline:2px solid var(--focus); outline-offset:2px; }

  nav.tabs { display:flex; gap:2px; border-bottom:1px solid var(--border); margin-bottom:20px; overflow-x:auto; }
  nav.tabs button { background:none; border:0; border-bottom:2px solid transparent; padding:9px 14px;
                    cursor:pointer; font-size:14px; color:var(--text-secondary); white-space:nowrap; margin-bottom:-1px; }
  nav.tabs button[aria-selected="true"] { color:var(--accent); font-weight:700; border-bottom-color:var(--accent); }

  /* まとまりの淵はテーマのメイン色。塗りは surface のままにして主張しすぎないようにする */
  .card { background:var(--surface-1); border:1px solid var(--card-line); border-radius:12px;
          padding:18px 20px; margin-bottom:16px; position:relative; }

  /* 見出しは中央。右肩の操作子はデスクトップでは絶対配置、狭い画面では下に回す */
  .card-head { position:relative; text-align:center; margin-bottom:14px; }
  .card-head h2 { font-size:16px; font-weight:700; margin:0; letter-spacing:.02em; }
  .card-head .tool { display:flex; justify-content:center; align-items:center; gap:8px; margin-top:10px; }
  @media (min-width:560px) {
    .card-head { min-height:34px; display:flex; align-items:center; justify-content:center; }
    .card-head .tool { position:absolute; right:0; top:50%; transform:translateY(-50%); margin-top:0; }
  }
  .card > h2 { font-size:16px; font-weight:700; margin:0 0 3px; text-align:center; letter-spacing:.02em; }
  .card > .caption { font-size:12px; color:var(--text-muted); margin:0 0 14px; text-align:center; }

  /* ---------- 月の送り ---------- */
  .month-nav { display:flex; align-items:center; justify-content:center; gap:14px;
               margin:0 0 14px; padding-bottom:12px; border-bottom:1px solid var(--border); }
  .month-nav .mn-b { width:34px; height:34px; flex:0 0 auto; display:flex; align-items:center;
                     justify-content:center; background:var(--surface-1); color:var(--text-secondary);
                     border:1px solid var(--border); border-radius:9px; cursor:pointer;
                     touch-action:manipulation; }
  .month-nav .mn-b:hover:not(:disabled) { background:var(--wash); color:var(--text-primary); }
  .month-nav .mn-b:disabled { opacity:.3; cursor:default; }
  .month-nav .mn-l { font-size:15px; font-weight:650; min-width:8.2em; text-align:center;
                     font-variant-numeric:tabular-nums; }

  .hero-card { text-align:center; }
  .hero-label { font-size:15px; font-weight:700; color:var(--text-secondary);
                margin:0 0 2px; letter-spacing:.03em; }
  .hero-value { font-size:44px; font-weight:640; line-height:1.1; letter-spacing:-.015em; }
  .hero-delta { font-size:13px; color:var(--text-secondary); margin-top:6px; }
  .hero-break { font-size:12px; color:var(--text-muted); margin-top:4px; }
  .delta-up { color:var(--up); font-weight:600; }
  .delta-down { color:var(--down); font-weight:600; }
  .delta-flat { color:var(--text-muted); font-weight:600; }

  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(148px,1fr)); gap:12px; margin-bottom:16px; }
  .tile { background:var(--surface-1); border:1px solid var(--card-line); border-radius:12px; padding:14px 16px; }
  .tile .k { display:flex; align-items:center; gap:7px; font-size:12px; color:var(--text-secondary); margin-bottom:4px; }
  .tile .v { font-size:21px; font-weight:620; line-height:1.2; }
  .tile .m { font-size:12px; color:var(--text-muted); margin-top:3px; }
  .tile .m .mlbl { margin-right:5px; }
  /* display を指定しないと、表のセルなど flex でない場所で潰れて見えなくなる */
  .swatch { display:inline-block; width:11px; height:11px; border-radius:3px; flex:0 0 auto; }

  /* ---------- ドーナツと内訳表 ---------- */
  .donut-row { display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:22px; }
  .donut-row .chart-host { flex:0 0 auto; margin:0 auto; }
  .legend-table { flex:1 1 280px; min-width:250px; width:100%; border-collapse:collapse; font-size:13px; }
  .legend-table th { text-align:left; font-size:11px; font-weight:600; color:var(--text-muted);
                     padding:0 0 8px; border-bottom:1px solid var(--axis); white-space:nowrap; }
  .legend-table th.num, .legend-table td.num { text-align:right; font-variant-numeric:tabular-nums; }
  .legend-table td { padding:10px 0; border-bottom:1px solid var(--border); }
  .legend-table td.name { display:flex; align-items:center; gap:9px; }
  .legend-table td.name span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .legend-table tfoot td { font-weight:700; border-top:1px solid var(--axis);
                           border-bottom:0; padding-top:11px; }
  .legend-table tfoot tr.sub td { font-weight:500; color:var(--text-secondary);
                                  border-top:0; padding-top:4px; }
  .legend-table tfoot tr.net td { border-top:1px solid var(--border); padding-top:9px; font-weight:700; }

  /* 給与の流れ */
  .flow { display:flex; flex-direction:column; gap:2px; }
  .flow .fr { display:flex; align-items:center; gap:10px; font-size:13px; padding:5px 0; }
  .flow .fr .fl { color:var(--text-secondary); display:flex; align-items:center; gap:8px; min-width:0; }
  .flow .fr .dot { width:9px; height:9px; border-radius:3px; flex:0 0 auto; }
  .flow .fr .fv { margin-left:auto; font-variant-numeric:tabular-nums; }
  .flow .fr.sub .fl { color:var(--text-muted); padding-left:14px; font-size:12px; }
  .flow .fr.sub .fv { color:var(--text-muted); font-size:12px; }
  .flow .fr.eq { border-top:1px solid var(--axis); margin-top:4px; padding-top:8px; }
  /* 主要な行（額面収入・可処分所得）は同じ太さにそろえる */
  .flow .fr.strong { font-weight:640; }
  .flow .fr.strong .fl { color:var(--text-primary); }
  .flow .fr.chk { border-top:1px dashed var(--border); margin-top:6px; padding-top:7px; }

  .filters { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
  .filters .lbl { font-size:12px; color:var(--text-muted); }
  /* ひとつずつ独立した角丸にする。選択中も四隅がそろって丸くなる */
  .seg { display:inline-flex; flex-wrap:wrap; gap:6px; }
  .seg button { background:var(--surface-1); border:1px solid var(--border); border-radius:8px;
                padding:6px 14px; font-size:13px; cursor:pointer; color:var(--text-secondary);
                touch-action:manipulation; }
  .seg button:hover { background:var(--wash); }
  .seg button[aria-pressed="true"] { background:var(--accent); color:var(--on-accent);
                                     border-color:transparent; font-weight:600; }

  .chart-host { position:relative; }
  .chart-wrap { display:flex; align-items:flex-start; }
  .y-axis { flex:0 0 auto; }
  .scroll-x { overflow-x:auto; overflow-y:hidden; flex:1 1 auto; min-width:0; -webkit-overflow-scrolling:touch; }
  svg { display:block; }
  svg text { font-family:inherit; }
  .tick-text { font-size:11px; fill:var(--text-muted); font-variant-numeric:tabular-nums; }
  .cap-text { font-size:11px; fill:var(--text-secondary); font-weight:600; font-variant-numeric:tabular-nums; }
  .name-text { font-size:12px; fill:var(--text-secondary); }
  .band { fill:transparent; cursor:pointer; }
  .band.sel { fill:var(--sel-wash); }
  .xhair { stroke:var(--axis); stroke-width:1; pointer-events:none; }

  @keyframes growUp { from { transform:scaleY(0);} to { transform:scaleY(1);} }
  @keyframes growRight { from { transform:scaleX(0);} to { transform:scaleX(1);} }
  @keyframes fadeIn { from { opacity:0;} to { opacity:1;} }
  .grow  { transform-box:view-box; animation:growUp .525s cubic-bezier(.22,.85,.3,1) backwards; }
  .growX { transform-box:view-box; animation:growRight .5s cubic-bezier(.22,.85,.3,1) backwards; }
  .fadein { animation:fadeIn .55s ease backwards; }
  @media (prefers-reduced-motion: reduce) { .grow,.growX,.fadein { animation:none; } }

  .legend-row { display:flex; gap:8px 18px; flex-wrap:wrap; margin-bottom:12px; }
  .legend-row .k { display:flex; align-items:center; gap:7px; font-size:12px; color:var(--text-secondary); }
  .legend-row .k b { font-weight:640; color:var(--text-primary); font-variant-numeric:tabular-nums; }

  .tooltip { position:absolute; z-index:5; pointer-events:none; opacity:0;
             background:var(--surface-1); border:1px solid var(--border); border-radius:9px;
             box-shadow:0 4px 16px rgba(0,0,0,.14); padding:9px 11px; min-width:176px;
             font-size:12px; transition:opacity .08s; }
  .tooltip.show { opacity:1; }
  .tooltip .tt-h { font-size:12px; color:var(--text-muted); margin-bottom:6px; }
  .tooltip .tt-r { display:flex; align-items:center; gap:8px; margin-top:3px; }
  .tooltip .tt-k { width:12px; height:2px; border-radius:1px; flex:0 0 auto; }
  .tooltip .tt-n { color:var(--text-secondary); flex:1 1 auto; white-space:nowrap; }
  .tooltip .tt-v { font-weight:640; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .tooltip .tt-t { border-top:1px solid var(--border); margin-top:7px; padding-top:6px; }

  .field { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  label.fl { font-size:12px; color:var(--text-secondary); }
  input[type="text"],input[type="month"],select {
    background:var(--page); border:1px solid var(--border); border-radius:8px;
    padding:6px 10px; font-size:16px; max-width:100%; }
  input[type="text"]:focus,input[type="month"]:focus,select:focus { border-color:var(--focus); }
  input.yen { text-align:right; font-variant-numeric:tabular-nums; width:140px; }

  .grp { margin-top:20px; }
  /* 大項目は小項目(14px)より一段大きく */
  .grp-h { display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:15px; font-weight:700;
           color:var(--text-primary); padding-bottom:7px; border-bottom:1px solid var(--border); }
  .grp-h .gt { margin-left:auto; font-size:13px; font-weight:600; color:var(--text-secondary);
               font-variant-numeric:tabular-nums; }
  /* はみ出し対策: 入る余地がなければ折り返す。中身も縮めるようにする */
  .row { display:flex; align-items:center; gap:10px; flex-wrap:wrap;
         padding:8px 0; border-bottom:1px solid var(--border); }
  .row:last-child { border-bottom:0; }
  .row > * { min-width:0; max-width:100%; }
  .row select { flex:0 1 auto; }
  .row input[type="text"] { flex:1 1 130px; }
  .row .rn { flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:14px; }
  .row .tagp { font-size:11px; color:var(--text-muted); border:1px solid var(--border);
               border-radius:999px; padding:1px 8px; flex:0 0 auto; }
  .row.ro { color:var(--text-muted); }
  .row.ro .fixed { font-variant-numeric:tabular-nums; font-size:14px; }
  @media (pointer:coarse) { .row { padding:10px 0; } .btn { padding:9px 14px; } .btn.small { padding:7px 12px; } }

  .sum-line { display:flex; align-items:baseline; gap:10px; }
  .sum-line + .sum-line { margin-top:4px; }
  .sum-line .sl { font-size:13px; font-weight:600; color:var(--text-secondary); }
  .sum-line .sv { margin-left:auto; font-variant-numeric:tabular-nums; font-size:15px; font-weight:640; }
  .sum-line.total { border-top:1px solid var(--axis); margin-top:8px; padding-top:8px; }
  .sum-line.total .sl { font-size:14px; font-weight:700; color:var(--text-primary); }
  .sum-line.total .sv { font-size:22px; font-weight:700; }

  /* ---------- ふるさと納税 ---------- */
  .meter { height:10px; border-radius:999px; background:var(--wash-strong); overflow:hidden; margin:10px 0 6px; }
  .meter i { display:block; height:100%; border-radius:999px; background:var(--accent); transition:width .4s ease; }
  .meter.over i { background:var(--down); }
  .meter-row { display:flex; align-items:baseline; gap:10px; font-size:12px; color:var(--text-muted); }
  .meter-row b { font-size:15px; font-weight:640; color:var(--text-primary); font-variant-numeric:tabular-nums; }
  .meter-row .rt { margin-left:auto; font-variant-numeric:tabular-nums; }
  .calc { border:1px solid var(--border); border-radius:9px; padding:10px 12px; margin-top:10px; background:var(--page); }
  .calc summary { font-size:12px; color:var(--text-secondary); cursor:pointer; }
  .calc .cr { display:flex; gap:10px; font-size:12px; padding:3px 0; color:var(--text-muted); }
  .calc .cr .cv { margin-left:auto; font-variant-numeric:tabular-nums; }
  .calc .cr.fin { border-top:1px solid var(--border); margin-top:5px; padding-top:6px;
                  color:var(--text-primary); font-weight:640; }
  .warnbox { border:1px solid var(--border); border-left:3px solid var(--accent);
             border-radius:8px; padding:10px 13px; font-size:12px; color:var(--text-secondary); margin-bottom:16px; }
  .gift { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); flex-wrap:wrap; }
  .gift:last-child { border-bottom:0; }
  .gift .gd { font-size:12px; color:var(--text-muted); font-variant-numeric:tabular-nums; flex:0 0 auto; }
  .gift .gi { flex:1 1 200px; min-width:0; }
  .gift .gi .gm { font-size:12px; color:var(--text-muted); }
  .gift .gi .gn { font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .gift .ga { font-variant-numeric:tabular-nums; font-weight:600; flex:0 0 auto; }
  .gift a.gl { font-size:12px; color:var(--accent); text-decoration:none; flex:0 0 auto; }
  .gift a.gl:hover { text-decoration:underline; }
  .form-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
  .form-grid label { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--text-secondary); }
  .form-grid input, .form-grid select { width:100%; }

  .note { font-size:12px; color:var(--text-muted); margin:10px 0 0; }
  .hint { font-size:12px; color:var(--text-muted); }

<script>
(function () {
  "use strict";

  var LS       = "shisan-tracker-v1";
  var LS_THEME = "shisan-tracker-theme";
  var LS_PAL   = "shisan-tracker-palette";
  /* 積み上げの系列色。同じ色相の濃淡なので、色覚特性に関わらず明度で見分けられる。
     並び順（積み上げ順）に対応させ、値の大小には結びつけない */
  /* 積み上げの系列色。主色(p)と副色(s)を交互に出し、同時に明度も振る。
     隣り合う系列が「色相」と「明度」の両方で違うので、単色の濃淡より格段に見分けやすい。
     並び順（積み上げ位置）に対応させ、値の大小には結びつけない */
  var SERIES = ["--p1","--s2","--p3","--s0","--p4"];

  /* 配色テーマ。主色＋調和する副色の2色相構成。
     各ランプは背景に対するコントラスト比 2.1/3.0/4.4/6.6/9.8 倍から逆算した5段 */
  var THEMES = {
    indigo: { name:"インディゴ",
      lp:["#9ab1e4","#6b93dc","#2976d3","#1e5ba5","#13427a"], ls:["#88bab3","#41a296","#0b857a","#06675e","#034b44"],
      dp:["#1a5194","#246abd","#5286d9","#88a4e0","#b2c2e9"], ds:["#055c54","#09776d","#0e978a","#70b0a7","#a7c9c4"] },
    forest: { name:"フォレスト",
      lp:["#75c09c","#19a774","#12875d","#0c6847","#064c33"], ls:["#a0b1d3","#7794c6","#4678bb","#265c9b","#194372"],
      dp:["#095d3f","#0f7953","#16996a","#51b68a","#9bcdb4"], ds:["#21528b","#2d6bb2","#6487c1","#90a5cd","#b7c3dc"] },
    sunset: { name:"サンセット",
      lp:["#e89f8c","#e1744b","#bf5827","#95431c","#6e3012"], ls:["#d7a3b0","#ca7c92","#c15074","#993a5a","#712941"],
      dp:["#863b18","#ac4e22","#d8642d","#e58e74","#ecb6a9"], ds:["#893350","#b04468","#c66a85","#d193a3","#dfb9c2"] },
    plum: { name:"プラム",
      lp:["#b2abde","#9589d4","#7967cc","#5e49b4","#443485"], ls:["#df9eb7","#d6749d","#c04e83","#953b65","#6e2a49"],
      dp:["#5441a1","#6d57ca","#887bd1","#a69dda","#c3bee4"], ds:["#86345a","#ac4575","#d25f93","#db8dac","#e5b5c7"] },
    mono: { name:"モノクローム",
      lp:["#b1b1ae","#94938f","#787670","#5d5b55","#43423d"], ls:["#a8b2be","#8594a7","#607993","#415e7a","#2e4459"],
      dp:["#53514c","#6c6a63","#888682","#a5a4a1","#c3c2c0"], ds:["#39546d","#4d6d8b","#75889e","#9aa5b4","#bcc3cc"] }
  };
  var THEME_ORDER = ["indigo","forest","sunset","plum","mono"];

  var storageOK=(function(){
    try { localStorage.setItem("__t","1"); localStorage.removeItem("__t"); return true; }
    catch(e){ return false; }
  })();
  function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
  function lsSet(k,v){ try { localStorage.setItem(k,v); return true; } catch(e){ return false; } }
  function lsDel(k){ try { localStorage.removeItem(k); } catch(e){} }
  function uid(){ return "x"+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }


  /* ============================== 資産の種別 ============================== */
  /* 資産3種はドーナツと積み上げに出るので、色相と明度の両方が違う並びを使う。
     負債はグラフに描かず、タイルと表のスウォッチにしか出ない */
  var ACATS = [
    { key:"cash",    label:"現金・預金",          v:"--p1", debt:false },
    { key:"equity",  label:"株式・投資信託・ETF",  v:"--s2", debt:false },
    { key:"pension", label:"年金・保険",          v:"--p3", debt:false },
    { key:"debt",    label:"負債",               v:"--s4", debt:true  }
  ];
  var AASSET = ACATS.filter(function(c){ return !c.debt; });
  var ACAT_BY = {};
  ACATS.forEach(function(c){ ACAT_BY[c.key]=c; });

  /* ============================== 初期データ ==============================
     家計簿の天引き（ded）は catId を持てる。
       catId なし → 税・社会保険。可処分所得の計算で引くだけ
       catId あり → そのカテゴリの支出として計上（家賃・任意保険・持株会）
     こうすると家賃は支出に一度だけ現れ、二重計上も不足も起きない。      */
  function emptyKakeibo() {
    return {
      cats: [
        { id:"food",  name:"食費",     items:[{id:"i1",name:"購入費"},{id:"i2",name:"外食費"}] },
        { id:"house", name:"住居費",   items:[{id:"i18",name:"管理費・その他"}] },
        { id:"daily", name:"日用品",   items:[{id:"i3",name:"日用品"}] },
        { id:"med",   name:"医療費",   items:[{id:"i4",name:"医療費"}] },
        { id:"tran",  name:"交通費",   items:[{id:"i5",name:"ガソリン"},{id:"i6",name:"タクシー"},{id:"i7",name:"電車"}] },
        { id:"util",  name:"光熱費",   items:[{id:"i8",name:"電気"},{id:"i9",name:"水道"},{id:"i10",name:"ガス"}] },
        { id:"ins",   name:"保険",     items:[{id:"i19",name:"その他保険"}] },
        { id:"subs",  name:"サブスク", items:[{id:"i11",name:"Spotify"},{id:"i12",name:"Netflix"}] },
        { id:"tax",   name:"税金",     items:[{id:"i20",name:"住民税・固定資産税など"}] },
        { id:"spec",  name:"特別費",   items:[{id:"i13",name:"特別費"}] },
        { id:"pock",  name:"お小遣い", items:[{id:"i14",name:"本人"},{id:"i15",name:"配偶者"}] },
        { id:"inv",   name:"投資",     items:[{id:"i16",name:"投資信託"},{id:"i17",name:"国内株"}] }
      ],
      earners: [
        { id:"e1", name:"本人", deds:[
          { id:"d1", name:"税・社会保険", catId:null },
          { id:"d2", name:"家賃",        catId:"house" },
          { id:"d3", name:"任意保険",     catId:"ins" },
          { id:"d4", name:"持株会",       catId:"inv" }
        ]},
        { id:"e2", name:"配偶者", deds:[
          { id:"d5", name:"税・社会保険", catId:null }
        ]}
      ],
      months: {},
      touched: {},
      furusato: { catId:"tax", plans:{}, gifts:[] }
    };
  }

  function defaultState(){
    return {
      version: 4,
      updatedAt: new Date().toISOString(),
      touched: {},
      accounts: [
        { id:uid(), name:"普通預金", cat:"cash" },
        { id:uid(), name:"つみたてNISA", cat:"equity" },
        { id:uid(), name:"iDeCo", cat:"pension" }
      ],
      months: {},
      kakeibo: emptyKakeibo()
    };
  }

  /* ---------- 読み込んだ内容の検証。壊れた値は捨てて落ちないようにする ---------- */
  function num(v){ var n=Number(v); return (isFinite(n)?Math.round(n):0); }
  function str(v,max){ return (typeof v==="string")?v.slice(0,max):""; }
  var MK_RE = /^\d{4}-(0[1-9]|1[0-2])$/;

  function sanitize(raw){
    var s = defaultState();
    if(!raw || typeof raw!=="object") return s;

    /* --- 資産 --- */
    s.accounts=[];
    if(Array.isArray(raw.accounts)) raw.accounts.forEach(function(a){
      if(!a||typeof a!=="object") return;
      var nm=str(a.name,60); if(!nm) return;
      s.accounts.push({ id:(typeof a.id==="string"&&a.id)?a.id:uid(), name:nm,
                        cat:ACAT_BY[a.cat]?a.cat:"cash" });
    });
    s.months={};
    if(raw.months&&typeof raw.months==="object") Object.keys(raw.months).forEach(function(mk){
      if(!MK_RE.test(mk)) return;
      var src=raw.months[mk], dst={};
      if(src&&typeof src==="object") Object.keys(src).forEach(function(id){
        var n=num(src[id]); if(n) dst[id]=n;
      });
      if(Object.keys(dst).length) s.months[mk]=dst;
    });
    s.updatedAt=(typeof raw.updatedAt==="string"&&!isNaN(Date.parse(raw.updatedAt)))?raw.updatedAt:null;
    s.touched={};
    if(raw.touched&&typeof raw.touched==="object") Object.keys(raw.touched).forEach(function(mk){
      var t=Number(raw.touched[mk]);
      if(MK_RE.test(mk)&&isFinite(t)&&t>0) s.touched[mk]=t;
    });

    /* --- 家計簿 --- */
    var r=raw.kakeibo;
    if(r&&typeof r==="object"){
      var k=emptyKakeibo();
      if(Array.isArray(r.cats)&&r.cats.length){
        k.cats=[];
        r.cats.forEach(function(c){
          if(!c||typeof c!=="object") return;
          var nm=str(c.name,20); if(!nm) return;
          var items=[];
          if(Array.isArray(c.items)) c.items.forEach(function(it){
            var inm=str(it&&it.name,20); if(!inm) return;
            items.push({ id:(typeof it.id==="string"&&it.id)?it.id:uid(), name:inm });
          });
          if(!items.length) items=[{id:uid(),name:nm}];
          k.cats.push({ id:(typeof c.id==="string"&&c.id)?c.id:uid(), name:nm, items:items });
        });
        if(!k.cats.length) k.cats=emptyKakeibo().cats;
      }
      var catIds={}; k.cats.forEach(function(c){ catIds[c.id]=1; });
      if(Array.isArray(r.earners)&&r.earners.length){
        k.earners=[];
        r.earners.forEach(function(e){
          if(!e||typeof e!=="object") return;
          var nm=str(e.name,20); if(!nm) return;
          var deds=[];
          if(Array.isArray(e.deds)) e.deds.forEach(function(d){
            var dnm=str(d&&d.name,20); if(!dnm) return;
            deds.push({ id:(typeof d.id==="string"&&d.id)?d.id:uid(), name:dnm,
                        catId:(d.catId&&catIds[d.catId])?d.catId:null });
          });
          if(!deds.length) deds=[{id:uid(),name:"税・社会保険",catId:null}];
          k.earners.push({ id:(typeof e.id==="string"&&e.id)?e.id:uid(), name:nm, deds:deds });
        });
        if(!k.earners.length) k.earners=emptyKakeibo().earners;
      }
      k.months={};
      if(r.months&&typeof r.months==="object") Object.keys(r.months).forEach(function(mk){
        if(!MK_RE.test(mk)) return;
        var src=r.months[mk]; if(!src||typeof src!=="object") return;
        var exp={}, inc={};
        if(src.exp&&typeof src.exp==="object") Object.keys(src.exp).forEach(function(id){
          var n=num(src.exp[id]); if(n) exp[id]=n;
        });
        if(src.inc&&typeof src.inc==="object") Object.keys(src.inc).forEach(function(eid){
          var rec=src.inc[eid]; if(!rec||typeof rec!=="object") return;
          var ded={};
          if(rec.ded&&typeof rec.ded==="object") Object.keys(rec.ded).forEach(function(did){
            var n=num(rec.ded[did]); if(n) ded[did]=n;
          });
          var g=num(rec.gross);
          if(g||Object.keys(ded).length) inc[eid]={gross:g,ded:ded};
        });
        if(Object.keys(exp).length||Object.keys(inc).length) k.months[mk]={exp:exp,inc:inc};
      });
      k.touched={};
      if(r.touched&&typeof r.touched==="object") Object.keys(r.touched).forEach(function(mk){
        var t=Number(r.touched[mk]);
        if(MK_RE.test(mk)&&isFinite(t)&&t>0) k.touched[mk]=t;
      });
      var fr=r.furusato;
      k.furusato={ catId:null, plans:{}, gifts:[] };
      if(fr&&typeof fr==="object"){
        k.furusato.catId=(fr.catId&&catIds[fr.catId])?fr.catId:null;
        if(fr.plans&&typeof fr.plans==="object") Object.keys(fr.plans).forEach(function(yy){
          if(!/^\d{4}$/.test(yy)) return;
          var py=fr.plans[yy]; if(!py||typeof py!=="object") return;
          var dst={};
          Object.keys(py).forEach(function(eid){
            var v=py[eid]; if(!v||typeof v!=="object") return;
            dst[eid]={ income:num(v.income), spouse:!!v.spouse, deps:Math.max(0,Math.min(9,num(v.deps))),
                       shaho:(v.shaho===null||v.shaho===undefined)?null:num(v.shaho),
                       manual:(v.manual===null||v.manual===undefined)?null:num(v.manual) };
          });
          k.furusato.plans[yy]=dst;
        });
        if(Array.isArray(fr.gifts)) fr.gifts.forEach(function(g){
          if(!g||typeof g!=="object") return;
          if(!/^\d{4}-\d{2}-\d{2}$/.test(String(g.date))) return;
          var amt=num(g.amount); if(amt<=0) return;
          k.furusato.gifts.push({ id:(typeof g.id==="string"&&g.id)?g.id:uid(),
            earnerId:str(g.earnerId,40), date:g.date, muni:str(g.muni,40),
            item:str(g.item,60), amount:amt, url:safeUrl(g.url) });
        });
      }
      s.kakeibo=k;
    }
    return s;
  }

  var state, kb;
  function setState(s){ state=s; kb=state.kakeibo; }

  (function load(){
    var raw=lsGet(LS);
    if(!raw){ setState(defaultState()); return; }
    try { setState(sanitize(JSON.parse(raw))); }
    catch(e){ setState(defaultState()); return; }
    /* 旧版（資産のみ）のデータには時刻が無い。手元のものを現在時点とみなして起点を作る */
    if(!state.updatedAt){ state.updatedAt=new Date().toISOString(); save(); }
  })();

  var saveT=null;
  function save(){
    state.updatedAt=new Date().toISOString();
    if(saveT) clearTimeout(saveT);
    saveT=setTimeout(function(){ lsSet(LS,JSON.stringify(state)); },120);
  }
  /* 月ごとの最終編集時刻。別端末とのマージでどちらが新しいかの判定に使う */
  function touch(mk){ if(!state.touched) state.touched={}; state.touched[mk]=Date.now(); }
  function ktouch(mk){ if(!kb.touched) kb.touched={}; kb.touched[mk]=Date.now(); }
  function fmtStamp(iso){
    if(!iso) return "不明";
    var d=new Date(iso); if(isNaN(d.getTime())) return "不明";
    function p(n){ return (n<10?"0":"")+n; }
    return d.getFullYear()+"/"+p(d.getMonth()+1)+"/"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());
  }

  /* ---------- デモ用のダミーデータ ---------- */
  function sampleKakeibo(){
    var k=emptyKakeibo();
    var base={ i1:52000,i2:18000,i18:4500,i3:12000,i4:4000,i5:9000,i6:2500,i7:7000,
               i8:11000,i9:5200,i10:6800,i19:3000,i11:980,i12:1490,i13:15000,
               i14:20000,i15:15000,i16:50000,i17:30000 };
    var fixedIds={ i11:1,i12:1,i14:1,i15:1,i18:1,i19:1 };
    var now=new Date();
    for(var q=11;q>=0;q--){
      var d=new Date(now.getFullYear(),now.getMonth()-q,1), mm=d.getMonth()+1;
      var mk=d.getFullYear()+"-"+(mm<10?"0":"")+mm, t=11-q;
      var win=(mm===1||mm===2||mm===12), bonus=(mm===6||mm===12);
      var exp={};
      Object.keys(base).forEach(function(id){
        var v=base[id];
        if(id==="i8"||id==="i10") v=Math.round(v*(win?1.45:1));
        if(id==="i13") v=(t%3===0)?Math.round(v*2.4):Math.round(v*0.3);
        if(fixedIds[id]){ exp[id]=v; return; }

  /* ---------- カテゴリの内訳推移（小項目の積み上げ面） ---------- */
  function trendSeriesFor(cat){
    /* 小項目 ＋ このカテゴリに入る天引きを系列にする。多すぎる場合は上位7＋その他 */
    var list=[];
    cat.items.forEach(function(it){ list.push({ name:it.name, get:function(mk){ return itemVal(mk,it.id); } }); });
    dedItemsForCat(cat.id).forEach(function(p){
      list.push({ name:p.d.name+"（天引き）", get:function(mk){ return dedVal(mk,p.e,p.d); } });
    });
    var months=scope();
    list.forEach(function(sv){ sv.sum=0; months.forEach(function(mk){ sv.sum+=sv.get(mk); }); });
    list=list.filter(function(sv){ return sv.sum>0; }).sort(function(a,b){ return b.sum-a.sum; });
    if(list.length>SERIES.length){
      var head=list.slice(0,SERIES.length-1), tail=list.slice(SERIES.length-1);
      head.push({ name:"その他", get:function(mk){ var t=0; tail.forEach(function(sv){ t+=sv.get(mk); }); return t; } });
      list=head;
    }
    list.forEach(function(sv,i){ sv.color=SERIES[i]; });
    return list;
  }

  function renderStack(host,months,series,animate){

    var tops=[];

            fill:"var(--surface-1)",stroke:"var("+sv.color+")","stroke-width":2}));

    /* 選択点：同系統の色で塗りつぶした点と、その金額を出す */

          fill:"var("+series[k].color+")",stroke:"var(--surface-1)","stroke-width":2}));

      });
      var topY=y(tops[series.length-1][i]);
      gSel.appendChild(s("text",{x:px.toFixed(1),y:(topY-13).toFixed(1),"text-anchor":"middle",
        "class":"cap-text",style:"font-weight:700",text:"計 "+yen(totals[i])}));

      clear(tip.el);

    months.forEach(function(mk,i){
      var w=n>1?step:innerW;
      var hit=s("rect",{x:(x(i)-w/2).toFixed(1),y:PT,width:w.toFixed(1),height:PH,"class":"band",
        tabindex:"0",role:"button","aria-label":monthLabel(mk)+" 合計 "+yen(totals[i])+"。選択するとこの月の内訳を見る"});
      gHit.appendChild(hit);
      function pick(){ ui.sel=mk; ui.animate=false; render(); }
      hit.addEventListener("pointermove",function(e){ paint(i); fillTip(i); tip.place(e.clientX,e.clientY); });
      hit.addEventListener("pointerleave",function(){ paint(selIdx); tip.hide(); });
      hit.addEventListener("focus",function(){ paint(i); fillTip(i); var r=hit.getBoundingClientRect(); tip.place(r.left+r.width/2,r.top+40); });
      hit.addEventListener("blur",function(){ paint(selIdx); tip.hide(); });
      hit.addEventListener("click",pick);
      hit.addEventListener("keydown",function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); pick(); } });
    });

    scroller.appendChild(svg); wrap.appendChild(scroller); host.appendChild(wrap);

  function arcPath(cx,cy,rOut,rIn,a0,a1){
    function pt(r,a){ return [cx+r*Math.cos(a), cy+r*Math.sin(a)]; }
    var large=(a1-a0)>Math.PI?1:0;
    var o0=pt(rOut,a0),o1=pt(rOut,a1),i1=pt(rIn,a1),i0=pt(rIn,a0);

           "A"+rOut+","+rOut+" 0 "+large+" 1 "+o1[0].toFixed(2)+","+o1[1].toFixed(2)+
           "L"+i1[0].toFixed(2)+","+i1[1].toFixed(2)+
           "A"+rIn+","+rIn+" 0 "+large+" 0 "+i0[0].toFixed(2)+","+i0[1].toFixed(2)+"Z";

  function renderDonut(host,mk,animate){

                    .filter(function(p){ return p.value>0; });

        node.classList.add("on"); show(p,e.clientX,e.clientY); });
      node.addEventListener("pointerleave",hide);
      node.addEventListener("focus",function(){
        Array.prototype.forEach.call(gMarks.childNodes,function(o){ o.classList.remove("on"); });
        node.classList.add("on");

      node.addEventListener("blur",hide);

  function aTrendPoints(){
    if(ui.aGran==="year"){
      var byYear={};
      aMonths().forEach(function(mk){ byYear[mk.slice(0,4)]=mk; });
      return Object.keys(byYear).sort().map(function(yy){
        var mk=byYear[yy];
        return { key:yy, label:yy, full:yy+"年", sub:(+mk.slice(5,7))+"月時点", mk:mk,
                 sel:!!ui.aSel&&ui.aSel.slice(0,4)===yy };
      });

    return aScope().map(function(mk){
      return { key:mk, label:monthTick(mk), full:monthLabel(mk), sub:"", mk:mk, sel:mk===ui.aSel };
    });
  }
  function aScope(){

  function renderAssetTrend(host,points,animate){
    clear(host);
    if(!points.length) return;
    var PR=4,PT=30,PB=30,PH=210,H=PH+PT+PB,BASE=PT+PH,MINB=40;
    var mx=0; points.forEach(function(p){ mx=Math.max(mx,assetTotal(p.mk)); });
    var sc=niceTicks(mx), unit=axisUnit(sc.max);
    var AX=axisWidth(sc.ticks,unit);
    var avail=Math.max(180,(host.clientWidth||640)-AX);
    var innerW=(points.length<=12)?Math.max(160,avail-PR):Math.max(avail-PR,points.length*MINB);
    var band=innerW/points.length, barW=Math.min(30,Math.max(9,band-10));
    var y=function(v){ return PT+PH-(v/sc.max)*PH; };

    var wrap=h("div",{cls:"chart-wrap"});
    wrap.appendChild(yAxisSvg(AX,H,PT,sc.ticks,y,unit));
    var scroller=h("div",{cls:"scroll-x"}), PW=innerW+PR;
    var svg=s("svg",{width:PW,height:H,viewBox:"0 0 "+PW+" "+H,role:"img",
      "aria-label":(ui.aGran==="year"?"総資産推移（年別）。":"総資産推移（月別）。")+
        points.map(function(p){ return p.full+" "+yen(assetTotal(p.mk)); }).join("。")});

    sc.ticks.forEach(function(t){ var yy=y(t);
      svg.appendChild(s("line",{x1:0,x2:innerW,y1:yy.toFixed(1),y2:yy.toFixed(1),
        stroke:t===0?"var(--axis)":"var(--grid)","stroke-width":1})); });

    var everyN=Math.max(1,Math.ceil((ui.aGran==="year"?34:38)/band));
    points.forEach(function(p,i){
      if(!p.sel&&i!==points.length-1&&(points.length-1-i)%everyN!==0) return;
      svg.appendChild(s("text",{x:(band*i+band/2).toFixed(1),y:PT+PH+17,"text-anchor":"middle",
        "class":"tick-text"+(p.sel?" sel-tick":""),text:p.label}));
    });

    var gB=s("g"),gM=s("g"); svg.appendChild(gB); svg.appendChild(gM);
    var bands=[];
    points.forEach(function(p,i){
      var bx=band*i;
      var r=s("rect",{x:bx.toFixed(1),y:PT,width:band.toFixed(1),height:PH,
        "class":"band"+(p.sel?" sel":""),tabindex:"0",role:"button",
        "aria-label":p.full+" 資産合計 "+yen(assetTotal(p.mk))+"。選択して内訳を見る"});
      gB.appendChild(r); bands.push({p:p,node:r,cx:bx+band/2});

      var g=s("g",animate?{"class":"grow",style:"transform-origin:0px "+BASE+"px;animation-delay:"+(i*22)+"ms"}:null);
      gM.appendChild(g);
      var x=bx+(band-barW)/2, cum=0, drawn=0;
      var stack=AASSET.map(function(c){ return { cat:c, value:aCatTotal(p.mk,c.key) }; })
                      .filter(function(q){ return q.value>0; });
      stack.forEach(function(q,k){
        var yTop=y(cum+q.value), yBot=y(cum); cum+=q.value;
        var top=yTop, bottom=yBot;
        if(drawn>0) bottom-=2;
        var hh=bottom-top; drawn++;
        if(hh<0.75) return;
        var isTop=(k===stack.length-1);
        var node=isTop
          ? s("path",{d:topRounded(x,top,barW,hh,4),fill:"var("+q.cat.v+")","class":"seg-mark"})
          : s("rect",{x:x,y:top.toFixed(2),width:barW,height:hh.toFixed(2),fill:"var("+q.cat.v+")","class":"seg-mark"});
        node.setAttribute("pointer-events","none");
        g.appendChild(node);
      });
      if(i===points.length-1&&cum>0){
        var lbl=fmtAxis(cum,unit)+"円", half=lbl.length*4.2;
        svg.appendChild(s("text",{x:Math.min(x+barW/2,PW-4-half).toFixed(1),y:(y(cum)-8).toFixed(1),
          "text-anchor":"middle","class":"cap-text"+(animate?" fadein":""),text:lbl}));
      }
    });
    scroller.appendChild(svg); wrap.appendChild(scroller); host.appendChild(wrap);

    var tip=mkTip(host);
    function fill(p){
      clear(tip.el);
      tip.el.appendChild(h("div",{cls:"tt-h",text:p.full+(p.sub?"（"+p.sub+"）":"")}));
      AASSET.forEach(function(c){
        var v=aCatTotal(p.mk,c.key); if(!v) return;
        tip.el.appendChild(tipRow(c.v,c.label,yen(v)));
      });
      tip.el.appendChild(tipRow(null,"資産合計",yen(assetTotal(p.mk)),"tt-t"));
      if(debtTotal(p.mk)) tip.el.appendChild(tipRow(null,"純資産",yen(netTotal(p.mk))));
    }
    bands.forEach(function(b){
      function pick(){ ui.aSel=b.p.mk; ui.animate=false; render(); }
      b.node.addEventListener("pointermove",function(e){ fill(b.p); tip.place(e.clientX,e.clientY); });
      b.node.addEventListener("pointerleave",tip.hide);
      b.node.addEventListener("focus",function(){ fill(b.p);
        var r=b.node.getBoundingClientRect(); tip.place(r.left+r.width/2,r.top+40); });
      b.node.addEventListener("blur",tip.hide);
      b.node.addEventListener("click",pick);
      b.node.addEventListener("keydown",function(e){
        if(e.key==="Enter"||e.key===" "){ e.preventDefault(); pick(); } });
    });
    var sel=bands.filter(function(b){ return b.p.sel; })[0];
    if(sel&&scroller.scrollWidth>scroller.clientWidth)
      scroller.scrollLeft=Math.max(0,sel.cx-scroller.clientWidth/2);
  }

  /* ============================== マージ ============================== */
  function sameVals(a,b){
    var ka=Object.keys(a), kb2=Object.keys(b);
    if(ka.length!==kb2.length) return false;
    for(var i=0;i<ka.length;i++){ if(a[ka[i]]!==b[ka[i]]) return false; }
    return true;
  }
  function sameMonthRec(a,b){
    if(!sameVals(a.exp||{},b.exp||{})) return false;
    var ia=a.inc||{}, ib=b.inc||{};
    var ka=Object.keys(ia), kb2=Object.keys(ib);
    if(ka.length!==kb2.length) return false;
    for(var i=0;i<ka.length;i++){
      var id=ka[i]; if(!ib[id]) return false;
      if((ia[id].gross||0)!==(ib[id].gross||0)) return false;
      if(!sameVals(ia[id].ded||{},ib[id].ded||{})) return false;
    }
    return true;
  }

  /* 月ごとに「どちらが新しいか」を判定する。月の時刻が無い古いファイルは
     ファイル全体の更新時刻で代用し、それも無ければ手元を優先する（データを失わない側に倒す） */
  function planMonths(mine,theirs,myT,inT,same){
    function mt(st,mk,fb){
      var t=st.touched&&st.touched[mk];
      return (typeof t==="number"&&isFinite(t))?t:fb;
    }
    var p={ add:[], update:[], same:[], localWins:[], localOnly:[] };
    var keys={};
    Object.keys(mine.months).forEach(function(k){ keys[k]=1; });
    Object.keys(theirs.months).forEach(function(k){ keys[k]=1; });
    Object.keys(keys).sort().forEach(function(mk){
      var a=mine.months[mk], b=theirs.months[mk];
      var ta=mt(mine,mk,myT), tb=mt(theirs,mk,inT);
      if(!a){
        if(mine.touched&&mine.touched[mk]&&mine.touched[mk]>tb) p.localWins.push(mk);
        else p.add.push(mk);
        return;
      }
      if(!b){ p.localOnly.push(mk); return; }
      if(same(a,b)){ p.same.push(mk); return; }
      if(tb>ta) p.update.push(mk); else p.localWins.push(mk);
    });
    p.mt=mt;
    return p;
  }

  function mergePlan(inc){
    var localT=Date.parse(state.updatedAt||"")||0;
    var incT=Date.parse(inc.updatedAt||"")||0;
    var plan={ inc:inc, localT:localT, incT:incT, accWins:incT>localT };

    plan.a=planMonths(state,inc,localT,incT,sameVals);
    plan.k=planMonths(kb,inc.kakeibo,localT,incT,sameMonthRec);

    var byId={};
    state.accounts.forEach(function(a){ byId[a.id]=a; });
    plan.addAcc=[]; plan.updAcc=[];
    inc.accounts.forEach(function(a){
      if(!byId[a.id]) plan.addAcc.push(a);
      else if(byId[a.id].name!==a.name||byId[a.id].cat!==a.cat) plan.updAcc.push(a);
    });

    var cById={}; kb.cats.forEach(function(c){ cById[c.id]=c; });
    plan.addCat=inc.kakeibo.cats.filter(function(c){ return !cById[c.id]; });
    var eById={}; kb.earners.forEach(function(e){ eById[e.id]=e; });
    plan.addEarner=inc.kakeibo.earners.filter(function(e){ return !eById[e.id]; });
    var gById={}; kb.furusato.gifts.forEach(function(g){ gById[g.id]=g; });
    plan.addGift=(inc.kakeibo.furusato.gifts||[]).filter(function(g){ return !gById[g.id]; });
    return plan;
  }

  function applyMerge(plan){
    var inc=plan.inc;
    /* 口座はユニオン。名前と種別はファイルが新しいときだけ上書き */
    plan.addAcc.forEach(function(a){ state.accounts.push({id:a.id,name:a.name,cat:a.cat}); });
    if(plan.accWins) plan.updAcc.forEach(function(a){
      var t=acctById(a.id); if(t){ t.name=a.name; t.cat=a.cat; } });
    if(!state.touched) state.touched={};
    plan.a.add.concat(plan.a.update).forEach(function(mk){
      var dst={};
      Object.keys(inc.months[mk]).forEach(function(id){ dst[id]=inc.months[mk][id]; });
      state.months[mk]=dst;
      state.touched[mk]=plan.a.mt(inc,mk,plan.incT);
    });

    /* 家計簿の項目もユニオン。消えることはない */
    plan.addCat.forEach(function(c){ kb.cats.push(JSON.parse(JSON.stringify(c))); });
    plan.addEarner.forEach(function(e){ kb.earners.push(JSON.parse(JSON.stringify(e))); });
    plan.addGift.forEach(function(g){ kb.furusato.gifts.push(JSON.parse(JSON.stringify(g))); });
    if(!kb.furusato.catId&&inc.kakeibo.furusato.catId) kb.furusato.catId=inc.kakeibo.furusato.catId;
    Object.keys(inc.kakeibo.furusato.plans||{}).forEach(function(yy){
      if(!kb.furusato.plans[yy]) kb.furusato.plans[yy]=inc.kakeibo.furusato.plans[yy];
    });
    if(!kb.touched) kb.touched={};
    plan.k.add.concat(plan.k.update).forEach(function(mk){
      kb.months[mk]=JSON.parse(JSON.stringify(inc.kakeibo.months[mk]));
      kb.touched[mk]=plan.k.mt(inc.kakeibo,mk,plan.incT);
    });
    save();
  }

  function importFromText(txt,reset){
    var done=reset||function(){};
    var parsed;
    try { parsed=JSON.parse(String(txt)); }
    catch(e){ toast("JSONとして読めませんでした"); done(); return; }
    var next=sanitize(parsed);
    if(!next.accounts.length&&!Object.keys(next.months).length&&!Object.keys(next.kakeibo.months).length){
      toast("読み込める内容が見つかりませんでした"); done(); return;
    }
    askImport(next,done);
  }

  function restoreScroll(){
    if(window.pageYOffset===keepY) return;
    window.scrollTo(0,keepY);
  }
  var PAGES={
    asum:buildAssetSummary, atrend:buildAssetTrend, ain:buildAssetInput, aacct:buildAccounts,
    sum:buildSummary, trend:buildTrend, in:buildInput, fs:buildFurusato, cfg:buildConfig,
    data:buildData
  };
  var CHARTY={ asum:1, atrend:1, sum:1, trend:1 };

  var sectEl=document.getElementById("sections"), tabsEl=document.getElementById("tabs");

  function buildTabs(){
    clear(tabsEl);
    var list=TABS[ui.sect]||[];
    /* データは1画面だけなので下段のタブは出さない */
    tabsEl.style.display=(list.length>1)?"":"none";
    list.forEach(function(t){
      tabsEl.appendChild(h("button",{type:"button",role:"tab","data-tab":t[0],
        "aria-selected":ui.tab===t[0]?"true":"false",text:t[1],
        onclick:function(){
          ui.tab=t[0]; ui.animate=!!CHARTY[t[0]]; render(); }}));
    });
    Array.prototype.forEach.call(sectEl.querySelectorAll("[data-sect]"),function(b){
      b.setAttribute("aria-pressed",b.getAttribute("data-sect")===ui.sect?"true":"false"); });
  }

  function render(){
    var keep=(lastTab===ui.tab);
    keepY=keep?(window.pageYOffset||document.documentElement.scrollTop||0):0;
    document.getElementById("storageWarn").style.display=storageOK?"none":"block";
    buildTabs();
    clear(view);
    view.appendChild((PAGES[ui.tab]||buildAssetSummary)());
    lastTab=ui.tab;
    restoreScroll();
  }

  Array.prototype.forEach.call(sectEl.querySelectorAll("[data-sect]"),function(b){
    b.addEventListener("click",function(){
      ui.sect=b.getAttribute("data-sect");
      ui.tab=TABS[ui.sect][0][0];
      ui.animate=!!CHARTY[ui.tab];
      render(); }); });

  var rz=null;
  window.addEventListener("resize",function(){ if(!CHARTY[ui.tab]) return;
    if(rz) clearTimeout(rz); rz=setTimeout(function(){ ui.animate=false; render(); },160); });
  render();
})();
</script>
